<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시골집 예약 달력</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#f6f1e8; color:#2f2a24; }
    .wrap { max-width:1100px; margin:0 auto; padding:18px; }
    h1 { margin:10px 0 5px; font-size:30px; }
    .subtitle { color:#6b6258; margin-bottom:18px; }
    .box { background:white; border-radius:16px; padding:16px; box-shadow:0 2px 10px rgba(0,0,0,.08); margin-bottom:16px; }
    .status { background:#fff9e8; border:1px solid #eed99f; border-radius:12px; padding:12px; margin-bottom:16px; }
    .grid { display:grid; grid-template-columns:1fr 330px; gap:16px; }
    button { border:0; background:#4b3f33; color:white; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:bold; margin:3px; }
    button.secondary { background:#8a7b6c; }
    button.danger { background:#b44536; }
    input, textarea { width:100%; box-sizing:border-box; padding:11px; border:1px solid #ddd2c6; border-radius:10px; margin-top:5px; font-size:15px; }
    label { font-weight:bold; font-size:14px; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .month-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px; }
    .month-title { font-size:24px; font-weight:bold; text-align:center; }
    .small { font-size:13px; color:#6b6258; }
    .week, .calendar { display:grid; grid-template-columns:repeat(7, 1fr); }
    .week div { text-align:center; font-weight:bold; padding:10px 0; background:#eee3d7; border:1px solid #f6f1e8; }
    .day { min-height:88px; border:1px solid #eee3d7; padding:7px; background:white; cursor:pointer; }
    .day.other { color:#bbb; background:#faf7f1; }
    .day.selected { outline:3px solid #4b3f33; outline-offset:-3px; }
    .day-num { font-weight:bold; }
    .badge { display:inline-block; margin-top:6px; padding:3px 7px; border-radius:999px; font-size:12px; font-weight:bold; }
    .available { background:#e3f6df; color:#226b2c; }
    .booked { background:#fde1dd; color:#a23225; }
    .guest { margin-top:4px; font-size:12px; background:#fff2ef; color:#8f2c22; padding:3px 5px; border-radius:6px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .reservation-card { border:1px solid #f1c7bf; background:#fff5f2; border-radius:12px; padding:12px; margin-bottom:10px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { border-bottom:1px solid #eee3d7; padding:10px; text-align:left; }
    @media (max-width:850px) { .grid { grid-template-columns:1fr; } .form-row { grid-template-columns:1fr; } .day { min-height:72px; font-size:13px; } h1 { font-size:25px; } }
  </style>
</head>
<body>
<div class="wrap">
  <h1>🏡 시골집 예약 달력</h1>
  <div class="subtitle">가족이 함께 보는 예약 현황표입니다. 예약된 날은 빨간색, 빈날은 초록색입니다.</div>
  <div class="status" id="status">구글시트 예약 정보를 불러오는 중...</div>

  <div class="grid">
    <div class="box">
      <div class="month-bar">
        <button class="secondary" onclick="moveMonth(-1)">◀ 이전달</button>
        <div>
          <div class="month-title" id="monthTitle"></div>
          <div class="small" id="monthStats"></div>
        </div>
        <button class="secondary" onclick="moveMonth(1)">다음달 ▶</button>
      </div>
      <div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
      <div class="calendar" id="calendar"></div>
    </div>

    <div>
      <div class="box">
        <h2>예약 추가</h2>
        <form onsubmit="addReservation(event)">
          <p><label>예약자 이름</label><input id="guestName" placeholder="예: 김민수" required></p>
          <p><label>연락처</label><input id="phone" placeholder="010-0000-0000"></p>
          <div class="form-row">
            <p><label>시작일</label><input id="startDate" type="date" required></p>
            <p><label>종료일</label><input id="endDate" type="date" required></p>
          </div>
          <p><label>인원</label><input id="people" type="number" min="1" value="2"></p>
          <p><label>메모</label><textarea id="memo" rows="3" placeholder="입금 여부, 청소 요청, 바베큐 사용 등"></textarea></p>
          <button type="submit">예약 확정하기</button>
          <button type="button" class="secondary" onclick="loadReservations()">새로고침</button>
        </form>
      </div>

      <div class="box">
        <h2>선택한 날짜</h2>
        <div id="selectedDateText" class="small"></div>
        <div id="selectedReservations"></div>
      </div>
    </div>
  </div>

  <div class="box">
    <h2>다가오는 예약</h2>
    <div id="upcomingReservations"></div>
  </div>
</div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzabgyV6TWblzmEP3DZyvtaJR8MxoQi5sDwXIRERnKIVciVbRv_IMazf_pWsoLOaBt2Qg/exec";

let reservations = [];
let currentMonth = new Date();
let selectedDate = toDateKey(new Date());

function toDateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function parseDateKey(key) {
  const p = key.split('-').map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
}
function addDays(date, days) {
  const copy = new Date(date);
  copy.setDate(copy.getDate() + days);
  return copy;
}
function formatKoreanDate(key) {
  const d = parseDateKey(key);
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
}
function getDatesInRange(startKey, endKey) {
  const dates = [];
  let current = parseDateKey(startKey);
  const end = parseDateKey(endKey);
  while (current <= end) {
    dates.push(toDateKey(current));
    current = addDays(current, 1);
  }
  return dates;
}
function getReservationMap() {
  const map = {};
  reservations.forEach(r => {
    if (!r.startDate || !r.endDate) return;
    getDatesInRange(r.startDate, r.endDate).forEach(dateKey => {
      if (!map[dateKey]) map[dateKey] = [];
      map[dateKey].push(r);
    });
  });
  return map;
}
async function apiRequest(action, payload = {}) {
  const res = await fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || '요청에 실패했습니다.');
  return data;
}
async function loadReservations() {
  setStatus('구글시트에서 예약 정보를 불러오는 중...');
  try {
    const data = await apiRequest('list');
    reservations = data.reservations || [];
    setStatus('예약 현황을 불러왔습니다.');
    render();
  } catch (e) {
    setStatus('연결 오류: ' + e.message + ' / Apps Script 배포 권한을 "모든 사용자"로 했는지 확인하세요.');
    render();
  }
}
function setStatus(text) { document.getElementById('status').innerText = text; }
function moveMonth(amount) {
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + amount, 1);
  render();
}
function hasConflict(startDate, endDate) {
  const map = getReservationMap();
  return getDatesInRange(startDate, endDate).some(d => map[d]);
}
async function addReservation(event) {
  event.preventDefault();
  const reservation = {
    guestName: document.getElementById('guestName').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    startDate: document.getElementById('startDate').value,
    endDate: document.getElementById('endDate').value,
    people: Number(document.getElementById('people').value || 1),
    memo: document.getElementById('memo').value.trim(),
    status: 'confirmed'
  };
  if (parseDateKey(reservation.endDate) < parseDateKey(reservation.startDate)) {
    alert('종료일은 시작일보다 빠를 수 없습니다.');
    return;
  }
  if (hasConflict(reservation.startDate, reservation.endDate)) {
    if (!confirm('이미 예약된 날짜가 포함되어 있습니다. 그래도 추가할까요?')) return;
  }
  setStatus('예약을 구글시트에 저장하는 중...');
  try {
    const data = await apiRequest('add', { reservation });
    reservations = data.reservations || [];
    selectedDate = reservation.startDate;
    currentMonth = parseDateKey(reservation.startDate);
    document.querySelector('form').reset();
    document.getElementById('people').value = 2;
    setStatus('예약이 저장되었습니다.');
    render();
  } catch (e) {
    alert(e.message);
    setStatus('예약 저장 실패: ' + e.message);
  }
}
async function deleteReservation(id) {
  if (!confirm('이 예약을 삭제할까요? 구글시트에서도 삭제됩니다.')) return;
  setStatus('예약을 삭제하는 중...');
  try {
    const data = await apiRequest('delete', { id });
    reservations = data.reservations || [];
    setStatus('예약이 삭제되었습니다.');
    render();
  } catch (e) {
    alert(e.message);
    setStatus('삭제 실패: ' + e.message);
  }
}
function render() {
  const map = getReservationMap();
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const start = addDays(firstDay, -firstDay.getDay());
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  let bookedDays = 0;
  for (let i = 1; i <= daysInMonth; i++) {
    const key = toDateKey(new Date(year, month, i));
    if (map[key]) bookedDays++;
  }
  document.getElementById('monthTitle').innerText = `${year}년 ${month + 1}월`;
  document.getElementById('monthStats').innerText = `예약 ${bookedDays}일 · 빈날 ${daysInMonth - bookedDays}일`;

  const calendar = document.getElementById('calendar');
  calendar.innerHTML = '';
  for (let i = 0; i < 42; i++) {
    const date = addDays(start, i);
    const key = toDateKey(date);
    const dayReservations = map[key] || [];
    const div = document.createElement('div');
    div.className = 'day';
    if (date.getMonth() !== month) div.className += ' other';
    if (key === selectedDate) div.className += ' selected';
    div.onclick = () => { selectedDate = key; render(); };
    let guestsHtml = dayReservations.slice(0, 2).map(r => `<div class="guest">${escapeHtml(r.guestName)}</div>`).join('');
    if (dayReservations.length > 2) guestsHtml += `<div class="small">+${dayReservations.length - 2}건</div>`;
    div.innerHTML = `<div class="day-num">${date.getDate()}</div>
      <span class="badge ${dayReservations.length ? 'booked' : 'available'}">${dayReservations.length ? '예약' : '가능'}</span>
      ${guestsHtml}`;
    calendar.appendChild(div);
  }
  renderSelected();
  renderUpcoming();
}
function renderSelected() {
  const map = getReservationMap();
  const list = map[selectedDate] || [];
  document.getElementById('selectedDateText').innerText = formatKoreanDate(selectedDate);
  const area = document.getElementById('selectedReservations');
  if (list.length === 0) {
    area.innerHTML = '<p class="badge available">이 날은 예약이 없습니다.</p>';
    return;
  }
  area.innerHTML = list.map(r => `
    <div class="reservation-card">
      <b>${escapeHtml(r.guestName)}</b><br>
      <span class="small">${formatKoreanDate(r.startDate)} ~ ${formatKoreanDate(r.endDate)}</span><br>
      연락처: ${escapeHtml(r.phone || '-')}<br>
      인원: ${escapeHtml(String(r.people || 1))}명<br>
      메모: ${escapeHtml(r.memo || '-')}<br><br>
      <button class="danger" onclick="deleteReservation('${r.id}')">삭제</button>
    </div>`).join('');
}
function renderUpcoming() {
  const today = toDateKey(new Date());
  const list = reservations
    .filter(r => r.endDate >= today)
    .sort((a, b) => a.startDate.localeCompare(b.startDate))
    .slice(0, 20);
  const area = document.getElementById('upcomingReservations');
  if (list.length === 0) {
    area.innerHTML = '<p class="small">다가오는 예약이 없습니다.</p>';
    return;
  }
  area.innerHTML = `<table><thead><tr><th>날짜</th><th>예약자</th><th>인원</th><th>연락처</th><th>메모</th></tr></thead><tbody>
    ${list.map(r => `<tr>
      <td>${escapeHtml(r.startDate)} ~ ${escapeHtml(r.endDate)}</td>
      <td>${escapeHtml(r.guestName)}</td>
      <td>${escapeHtml(String(r.people || 1))}명</td>
      <td>${escapeHtml(r.phone || '-')}</td>
      <td>${escapeHtml(r.memo || '-')}</td>
    </tr>`).join('')}
    </tbody></table>`;
}
function escapeHtml(text) {
  return String(text)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}
loadReservations();
</script>
</body>
</html>
